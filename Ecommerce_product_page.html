<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple E-Commerce Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .container {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      max-width: 900px;
      margin: auto;
    }

    .product {
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    .product img {
      max-width: 100%;
      border-radius: 8px;
    }

    .price {
      display: block;
      margin: 10px 0;
      font-size: 20px;
      font-weight: bold;
      color: #28a745;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .cart {
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 250px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Product Image">
      <h2>Wireless Headphones</h2>
      <p>High quality sound with noise cancellation and long battery life.</p>
      <span class="price">$49.99</span>
      <button id="addToCartBtn">Add to Cart</button>
    </div>

    <div class="cart">
      <h3>Shopping Cart</h3>
      <p>Items in cart: <span id="cartCount">0</span></p>
    </div>
  </div>

  <script>
    let cartCount = 0;

    document.getElementById('addToCartBtn').addEventListener('click', function() {
      cartCount++;
      document.getElementById('cartCount').textContent = cartCount;
    });
  </script>

</body>
</html>
